<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>WeightNote Pro</title>

  <meta name="theme-color" content="#111827">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>🏋️ WeightNote Pro</h1>


  <!-- 오늘 운동 입력 -->

  <div class="card">

    <h2>오늘 운동</h2>

    <label>운동 부위</label>

    <select id="category">
      <option>가슴</option>
      <option>등</option>
      <option>하체</option>
      <option>어깨</option>
      <option>팔</option>
      <option>복근</option>
      <option>유산소</option>
    </select>


    <label>운동 검색</label>

    <input
      type="text"
      id="searchExercise"
      placeholder="운동 이름 검색">


    <label>운동 종목</label>

    <select id="exercise"></select>


    <!-- 웨이트 입력 -->

    <div id="weightFields">

      <label>무게 (kg)</label>

      <input
        type="number"
        id="weightInput"
        placeholder="예: 60"
        min="0"
        step="0.5"
        inputmode="decimal">


      <label>횟수</label>

      <input
        type="number"
        id="repsInput"
        placeholder="예: 10"
        min="1"
        step="1"
        inputmode="numeric">

    </div>


    <!-- 유산소 입력 -->

    <div id="cardioFields" hidden>

      <label>시간 (분)</label>

      <input
        type="number"
        id="durationInput"
        placeholder="예: 30"
        min="1"
        step="1"
        inputmode="numeric">


      <label>거리 (km)</label>

      <input
        type="number"
        id="distanceInput"
        placeholder="예: 3.5"
        min="0"
        step="0.1"
        inputmode="decimal">

    </div>


    <p>
      총 운동량 :
      <b><span id="volume">0</span> kg</b>
    </p>

    <p>
      오늘 운동 기록 :
      <b><span id="sets">0</span></b>
    </p>


    <button id="startBtn">
      ➕ 세트 추가
    </button>

  </div>


  <!-- 오늘 PR -->

  <div class="card">

    <h2>오늘의 최고 기록(PR)</h2>

    <div id="pr">
      아직 기록이 없습니다.
    </div>

  </div>


  <!-- 오늘 기록 -->

  <div class="card">

    <h2>오늘 운동 기록</h2>

    <div id="history">
      아직 기록이 없습니다.
    </div>

  </div>


  <!-- 지난 기록 -->

  <div class="card">

    <h2>지난 운동 기록</h2>

    <label for="historyDate">
      날짜 선택
    </label>

    <input
      type="date"
      id="historyDate">

    <div id="pastHistory">
      날짜를 선택해주세요.
    </div>

  </div>


  <!-- 휴식 타이머 -->

  <div class="card">

    <h2>휴식 타이머</h2>

    <button id="timer60">60초</button>
    <button id="timer90">90초</button>
    <button id="timer120">120초</button>

    <p id="timerText">
      타이머 대기중
    </p>

  </div>

</div>


<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./service-worker.js");
}
</script>

<script src="app.js"></script>

</body>
</html>
