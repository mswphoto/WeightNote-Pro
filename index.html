<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="WeightNote Pro"
    >

    <title>WeightNote Pro</title>

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>


<body>

<div class="container">

    <h1>🏋️ WeightNote Pro</h1>


    <!-- 오늘 운동 입력 -->

    <section class="card">

        <h2>오늘 운동</h2>


        <label for="category">
            운동 부위
        </label>

        <select id="category">

            <option value="가슴">가슴</option>
            <option value="등">등</option>
            <option value="하체">하체</option>
            <option value="어깨">어깨</option>
            <option value="팔">팔</option>
            <option value="복근">복근</option>
            <option value="유산소">유산소</option>

        </select>


        <label for="searchExercise">
            운동 검색
        </label>

        <input
            id="searchExercise"
            type="search"
            placeholder="운동 이름 검색"
            autocomplete="off"
        >


        <label for="exercise">
            운동 종목
        </label>

        <select id="exercise"></select>


        <!-- 최근 기록 -->

        <div
            id="lastRecord"
            class="last-record"
        >
            최근 기록이 없습니다.
        </div>


        <!-- 웨이트 입력 -->

        <div id="weightFields">

            <label for="weightInput">
                무게 (kg)
            </label>

            <input
                id="weightInput"
                type="number"
                inputmode="decimal"
                min="0"
                step="0.5"
                placeholder="예: 60"
            >


            <label for="repsInput">
                횟수
            </label>

            <input
                id="repsInput"
                type="number"
                inputmode="numeric"
                min="1"
                step="1"
                placeholder="예: 10"
            >

        </div>


        <!-- 유산소 입력 -->

        <div
            id="cardioFields"
            hidden
        >

            <label for="durationInput">
                시간 (분)
            </label>

            <input
                id="durationInput"
                type="number"
                inputmode="decimal"
                min="0"
                step="1"
                placeholder="예: 30"
            >


            <label for="distanceInput">
                거리 (km)
            </label>

            <input
                id="distanceInput"
                type="number"
                inputmode="decimal"
                min="0"
                step="0.1"
                placeholder="예: 3.5"
            >

        </div>


        <!-- 오늘 요약 -->

        <p>
            총 운동량 :
            <strong>
                <span id="volume">0</span> kg
            </strong>
        </p>

        <p>
            오늘 운동 기록 :
            <strong>
                <span id="sets">0</span>
            </strong>
        </p>


        <button
            id="startBtn"
            type="button"
        >
            ➕ 세트 추가
        </button>

    </section>


    <!-- 오늘 PR -->

    <section class="card">

        <h2>
            오늘의 최고 기록(PR)
        </h2>

        <div id="pr">
            아직 기록이 없습니다.
        </div>

    </section>


    <!-- 오늘 운동 기록 -->

    <section class="card">

        <h2>
            오늘 운동 기록
        </h2>

        <div id="history">
            오늘 기록이 없습니다.
        </div>

    </section>


    <!-- 지난 운동 기록 -->

    <section class="card">

        <h2>
            지난 운동 기록
        </h2>


        <label for="historyDate">
            날짜 선택
        </label>

        <input
            id="historyDate"
            type="date"
        >


        <div id="pastHistory">
            날짜를 선택해주세요.
        </div>

    </section>


    <!-- 휴식 타이머 -->

    <section class="card">

        <h2>
            휴식 타이머
        </h2>


        <button
            id="timer60"
            type="button"
        >
            60초
        </button>


        <button
            id="timer90"
            type="button"
        >
            90초
        </button>


        <button
            id="timer120"
            type="button"
        >
            120초
        </button>


        <div id="timerText">
            타이머 대기중
        </div>

    </section>

</div>


<!-- WeightNote Pro JavaScript -->

<script src="./app.js"></script>


<!-- Service Worker -->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", function () {

        navigator.serviceWorker
            .register("./service-worker.js")
            .then(function (registration) {

                console.log(
                    "Service Worker 등록 성공:",
                    registration.scope
                );

            })
            .catch(function (error) {

                console.error(
                    "Service Worker 등록 실패:",
                    error
                );

            });

    });

}

</script>

</body>
</html>
